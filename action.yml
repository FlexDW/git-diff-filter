name: 'Git Diff Filter'
description: 'Installs a utility for conditional CI/CD workflow triggering'
author: 'FlexDW'

branding:
  icon: 'filter'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Download and install gdf
      shell: bash
      run: |
        if [ -z "$GITHUB_ACTION_REF" ] || [ "$GITHUB_ACTION_REF" = "latest" ]; then
          BINARY_URL="https://github.com/${GITHUB_ACTION_REPOSITORY}/releases/latest/download/gdf-linux-x86_64"
        else
          BINARY_URL="https://github.com/${GITHUB_ACTION_REPOSITORY}/releases/download/${GITHUB_ACTION_REF}/gdf-linux-x86_64"
        fi
        
        echo "Downloading gdf from ${BINARY_URL}"
        curl -L "${BINARY_URL}" -o gdf
        chmod +x gdf
        sudo mv gdf /usr/local/bin/
        
        echo "gdf installed successfully"
        gdf --version || echo "gdf ${GITHUB_ACTION_REF}"
