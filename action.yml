name: 'Git Diff Filter'
description: 'Installs a utility for conditional CI/CD workflow triggering'
author: 'FlexDW'

branding:
  icon: 'filter'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Download and install gdf
      shell: bash
      env:
        GDF_ACTION_REF: ${{ github.action_ref }}
        GDF_ACTION_REPO: ${{ github.action_repository }}
      run: |
        BINARY_URL="https://github.com/${GDF_ACTION_REPO}/releases/download/${GDF_ACTION_REF}/gdf-linux-x86_64"
        
        echo "Downloading gdf from ${BINARY_URL}"
        curl --fail -L "${BINARY_URL}" -o gdf
        chmod +x gdf
        sudo mv gdf /usr/local/bin/
        
        echo "gdf installed successfully"
        gdf --version
