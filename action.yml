name: 'Git Diff Filter'
description: 'Installs a utility for conditional CI/CD workflow triggering'
author: 'FlexDW'

branding:
  icon: 'filter'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Download and install gdf
      shell: bash
      run: |
        BINARY_URL="https://github.com/${{ github.action_repository }}/releases/download/${{ github.action_ref }}/gdf-linux-x86_64"
        
        echo "Downloading gdf from ${BINARY_URL}"
        curl --fail -L "${BINARY_URL}" -o gdf
        chmod +x gdf
        sudo mv gdf /usr/local/bin/
        
        echo "gdf installed successfully"
        gdf --version
