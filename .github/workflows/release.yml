name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (ignored if version_override is set)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version_override:
        description: 'Override version (e.g., v1.2.3) - skips automatic bump'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        if: ${{ !inputs.version_override }}
        run: |
          CURRENT_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)
          if [ -z "$CURRENT_TAG" ]; then
            echo "Error: No semantic version tags found (v*.*.*)." >&2
            exit 1
          fi
          echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_TAG"

      - name: Calculate new version from bump
        id: bumped
        if: ${{ !inputs.version_override }}
        run: |
          NEW_TAG=$(./scripts/generate-version.py "${{ steps.current.outputs.tag }}" ${{ inputs.bump }})
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Calculated version: $NEW_TAG"

      - name: Use override version
        id: override
        if: ${{ inputs.version_override }}
        run: |
          VERSION="${{ inputs.version_override }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Override version must match format v#.#.# (e.g., v1.2.3). Got: $VERSION" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Using override version: $VERSION"

      - name: Update Cargo.toml version
        # overwrite config so binary aligns with release without updating the code 
        run: |
          VERSION_TAG="${{ steps.bumped.outputs.tag || steps.override.outputs.tag }}"
          VERSION_NUMBER="${VERSION_TAG#v}"
          echo "Updating Cargo.toml version to $VERSION_NUMBER"
          sed -i 's/^version = ".*"/version = "'"$VERSION_NUMBER"'"/' Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Build binary with Docker
        run: |
          docker build -t gdf-builder .
          docker create --name gdf-container gdf-builder
          docker cp gdf-container:/build/target/release/gdf ./gdf-linux-x86_64
          docker rm gdf-container
          chmod +x ./gdf-linux-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.bumped.outputs.tag || steps.override.outputs.tag }}
          name: Release ${{ steps.bumped.outputs.tag || steps.override.outputs.tag }}
          files: gdf-linux-x86_64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
